[project]
name = "feedscan"
version = "0.4.2"
description = "Poll a handful of RSS feeds and keep the entries in SQLite"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "defusedxml>=0.7.1"]

[project.scripts]
feedscan = "feedscan.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
